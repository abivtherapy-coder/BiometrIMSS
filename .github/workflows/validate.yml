name: Validate BiometrIMSS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, christmas-2026-visual-v2]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
